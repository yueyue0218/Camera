# Portra production Nginx template.
# Install on the ECS host as the active server block, then run:
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.250.86.6 _;

    root /var/www/dist;
    index index.html;
    client_max_body_size 50m;

    location ~ ^/(api|admin|auth|sessions|users|demands|service-packages|services|conversations|files|orders|quotations|quotes|payments|notifications|moments|reviews|disputes|photo-authorizations|me|test|secure)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
