# Portra production Nginx template.
# Replace portra.example.com and certificate paths before enabling this file.
# Validate with `sudo nginx -t` before reloading Nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portra.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portra.example.com;

    ssl_certificate /etc/letsencrypt/live/portra.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portra.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/dist;
    index index.html;
    client_max_body_size 50m;

    # Nginx is the public edge. Ignore client-supplied forwarding headers and
    # pass only the directly observed peer address to the application.
    location ~ ^/(api|admin|auth|users|demands|service-packages|services|conversations|files|orders|quotations|quotes|payments|notifications|moments|reviews|disputes|photo-authorizations|me)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
