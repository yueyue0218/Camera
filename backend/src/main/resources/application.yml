server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/camera_app?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:587}
    default-encoding: UTF-8
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:}
  expire-hours: 24

file:
  storage:
    local-path: ./uploads

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

camera:
  session:
    refresh-cookie-name: ${SESSION_REFRESH_COOKIE_NAME:camera_refresh}
    refresh-ttl: P${SESSION_REFRESH_TTL_DAYS:30}D
  sms:
    provider: ${SMS_PROVIDER:}
    endpoint: ${SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:}
    login-template-id: ${SMS_LOGIN_TEMPLATE_ID:}
    code-pepper: ${SMS_CODE_PEPPER:}
    code-ttl: ${SMS_CODE_TTL:5m}
    resend-cooldown: ${SMS_RESEND_COOLDOWN:60s}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    phone-hourly-limit: ${SMS_PHONE_HOURLY_LIMIT:5}
    phone-daily-limit: ${SMS_PHONE_DAILY_LIMIT:20}
    ip-hourly-limit: ${SMS_IP_HOURLY_LIMIT:20}
    ip-daily-limit: ${SMS_IP_DAILY_LIMIT:100}
    device-hourly-limit: ${SMS_DEVICE_HOURLY_LIMIT:10}
    device-daily-limit: ${SMS_DEVICE_DAILY_LIMIT:50}
  order:
    adapter: local
    c-base-url: http://localhost:8080
