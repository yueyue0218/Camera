# External configuration; secrets remain in root-owned app.env, never in this bundle.
server.address=127.0.0.1
server.port=8081
server.shutdown=graceful
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/portra_integration?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=30000
spring.datasource.username=portra_int_app
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
file.storage.local-path=/opt/portra-integration/uploads
camera.order.adapter=local
camera.order.c-base-url=http://127.0.0.1:8081
camera.demo.seed-users=false
camera.cors.allowed-origin-patterns[0]=http://127.0.0.1:8081
camera.session.refresh-cookie-name=portra_integration_refresh
camera.sms.provider=dypns
camera.sms.staging-dypns-enabled=true
camera.sms.staging-aliyun-enabled=false
camera.sms.dypns-endpoint=dypnsapi.aliyuncs.com
# Image limits bound per-request decoded memory on this small ECS instance.
camera.files.image.max-size-bytes=10485760
camera.files.image.max-width=8192
camera.files.image.max-height=8192
camera.files.image.max-pixels=12000000
spring.servlet.multipart.file-size-threshold=0
logging.level.root=INFO

camera.integration.runtime-ddl-enabled=false
