client_max_body_size 50m;

# Browser API namespace: strip /api/web/; native /api controllers stay unchanged.
location ^~ /api/web/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Existing non-admin clients, native /api endpoints and health checks keep their paths.
# /admin belongs to React navigation; staging admin calls use /api/web/admin.
location ~ ^/(api|auth|users|demands|service-packages|services|conversations|files|orders|quotations|quotes|payments|notifications|moments|reviews|disputes|photo-authorizations|me|reports)(/|$) {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

location / {
    root /var/www/dist;
    index index.html;
    try_files $uri $uri/ /index.html;
}
