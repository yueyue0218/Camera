name: Deploy to Server

on:
  workflow_run:
    workflows: ["Project CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy frontend and backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload frontend to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "dist"
          target: "/var/www/"

      - name: Upload backend JAR to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "jar/*.jar"
          target: "/opt/portra/app/"
          strip_components: 1

      - name: Restart Portra backend
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e

            cd /opt/portra/app

            rm -f app.jar

            JAR_FILE="$(find . -maxdepth 1 -type f -name '*.jar' | head -n 1)"
            test -n "$JAR_FILE"

            mv "$JAR_FILE" app.jar
            chgrp portra app.jar
            chmod 640 app.jar

            sudo /usr/bin/systemctl restart portra-backend.service

            sleep 5

            sudo /usr/bin/systemctl is-active portra-backend.service

