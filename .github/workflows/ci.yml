name: Project CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend static check
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  backend:
    name: Backend test, coverage and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check project structure
        run: |
          test -d backend
          test -d frontend
          test -d docs
          test -f backend/mvnw
          test -f frontend/package.json
          test -f frontend/package-lock.json

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run named backend integration tests
        working-directory: backend
        run: ./mvnw -B -Dtest='*IntegrationTest' test

      - name: Run backend verification and coverage gate
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Upload backend test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-evidence
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload backend JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 30
